<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bespoke Culinary | Recipe Book</title>
    
    <!-- Google Fonts: Playfair Display (Serif) and Inter (Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration for Luxury Aesthetic -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: {
                            900: '#111111',
                            800: '#18181A',
                            700: '#222225',
                            600: '#333336'
                        },
                        gold: {
                            400: '#D9B76A',
                            500: '#C4A35A',
                            600: '#A68A48'
                        },
                        offwhite: '#ECEBE8'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-charcoal-900 text-offwhite font-sans antialiased selection:bg-gold-500 selection:text-charcoal-900 overflow-x-hidden">

    <!-- App Wrapper -->
    <div class="app-wrapper flex flex-col lg:flex-row min-h-screen">
        
        <!-- ================= SIDEBAR (CATEGORIES) ================= -->
        <aside class="category-sidebar w-full lg:w-64 lg:fixed lg:h-screen lg:border-r border-white/5 bg-charcoal-900 z-10 flex flex-col justify-between py-8 px-6">
            <div>
                <!-- Brand / Logo -->
                <div class="brand-logo mb-16">
                    <h1 class="font-serif text-3xl font-bold tracking-wide">Culinary<span class="text-gold-500">.</span></h1>
                    <p class="text-xs text-gray-500 tracking-widest uppercase mt-2">Private Collection</p>
                </div>

                <!-- Navigation / Filters -->
                <nav class="category-nav flex flex-row overflow-x-auto lg:flex-col gap-6 lg:gap-8 pb-4 lg:pb-0 hide-scrollbar">
                    <button class="js-category-filter js-category-filter-allCategories text-left text-sm tracking-wider uppercase flex items-center gap-3 text-gold-500 font-medium transition-colors whitespace-nowrap">
                        <span class="w-8 h-[1px] bg-gold-500 hidden lg:block"></span> All Recipes
                    </button>
                    <button class="js-category-filter text-left text-sm tracking-wider uppercase flex items-center gap-3 text-gray-400 hover:text-offwhite transition-colors whitespace-nowrap">
                        <span class="w-8 h-[1px] bg-transparent hidden lg:block"></span> Breakfast
                    </button>
                    <button class="js-category-filter text-left text-sm tracking-wider uppercase flex items-center gap-3 text-gray-400 hover:text-offwhite transition-colors whitespace-nowrap">
                        <span class="w-8 h-[1px] bg-transparent hidden lg:block"></span> Starters
                    </button>
                    <button class="js-category-filter text-left text-sm tracking-wider uppercase flex items-center gap-3 text-gray-400 hover:text-offwhite transition-colors whitespace-nowrap">
                        <span class="w-8 h-[1px] bg-transparent hidden lg:block"></span> Salads & Soups
                    </button>
                    <button class="js-category-filter text-left text-sm tracking-wider uppercase flex items-center gap-3 text-gray-400 hover:text-offwhite transition-colors whitespace-nowrap">
                        <span class="w-8 h-[1px] bg-transparent hidden lg:block"></span> Main Course
                    </button>
                    <button class="js-category-filter js-category-filter-favourite text-left text-sm tracking-wider uppercase flex items-center gap-3 text-gray-400 hover:text-offwhite transition-colors whitespace-nowrap">
                        <span class="w-8 h-[1px] bg-transparent hidden lg:block"></span> Favourites
                    </button>
                </nav>
            </div>
            
            <!-- User/Profile area (Decorative) -->
            <div class="hidden lg:flex items-center gap-3 mt-12 pt-8 border-t border-white/5">
                <div class="w-10 h-10 rounded-full bg-charcoal-700 flex items-center justify-center text-gold-500 font-serif">A</div>
                <div class="text-sm text-gray-400">Head Chef</div>
            </div>
        </aside>


        
        <!-- ================= MAIN CONTENT ================= -->
        <main class="main-content flex-1 lg:ml-64 p-6 md:p-12 xl:p-16">
            
            <!-- Header Row -->
            <header class="top-bar flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-16">
                
                <!-- Search Bar -->
                <div class="search-container relative w-full md:w-96 group">
                    <i class="fa-solid fa-search absolute left-0 top-3 text-gray-500 group-focus-within:text-gold-500 transition-colors"></i>
                    <input type="text" placeholder="Search ingredients, names..." class="js-search-input w-full bg-transparent border-b border-white/10 py-2 pl-8 pr-4 text-sm text-offwhite placeholder-gray-600 focus:outline-none focus:border-gold-500 transition-colors">
                </div>

                <!-- Add Recipe Button -->
                <button class="add-recipe-btn js-open-add-modal flex items-center gap-3 bg-gold-500 hover:bg-gold-400 text-charcoal-900 px-6 py-3 rounded-none text-sm font-medium tracking-wide uppercase transition-all  hover:translate-x-[2px] hover:translate-y-[2px]">
                    <i class="fa-solid fa-plus"></i> Add Recipe
                </button>
            </header>

            <!-- Page Title -->
            <div class="mb-12">
                <h2 class="font-serif text-4xl md:text-5xl lg:text-6xl text-offwhite font-light">Curated <br> <span class="text-gray-500 italic">Gastronomy</span></h2>
            </div>

            <!-- ================= RECIPE GRID ================= -->
            <div class="recipe-grid grid grid-flow-col grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-10 gap-y-16">

             

           

            </div>
        </main>
    </div>

    <!-- ================= RECIPE DETAILS MODAL ================= -->
    <!-- Add 'hidden' class to root div to hide. Removed for structural preview, assuming JS will control it. -->
      <div class="recipe-modal-backdrop fixed inset-0 z-50  items-center justify-center p-4 bg-charcoal-900/90 backdrop-blur-md hidden transition-opacity"></div>

    </div>
   
    <!-- in extra and script.js -->

    <!-- ================= ADD RECIPE MODAL ================= -->
    <div class="add-recipe-modal-backdrop fixed inset-0 z-50 flex hidden items-center justify-center p-4 bg-charcoal-900/90 backdrop-blur-md  transition-opacity">
        
        <div class="add-recipe-window relative w-full max-w-2xl bg-charcoal-800 rounded-lg shadow-2xl p-8 md:p-12 border border-white/10 max-h-[90vh] overflow-y-auto hide-scrollbar">
            
            <button class="js-close-add-modal absolute top-4 right-4 w-10 h-10 bg-charcoal-700 hover:bg-red-900 text-offwhite rounded-full flex items-center justify-center transition-colors">
                <i class="fa-solid fa-times"></i>
            </button>

            <h2 class="font-serif text-3xl text-offwhite mb-2">Create Recipe</h2>
            <p class="text-sm text-gray-500 mb-8">Add a new masterpiece to your private collection.</p>

            <form id="add-recipe-form" class="space-y-6">
                
                <!-- Recipe Title -->
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Recipe Title</label>
                    <input type="text" class="js-input-title w-full bg-charcoal-900 border border-white/10 p-3 text-sm text-offwhite focus:outline-none focus:border-gold-500 transition-colors" placeholder="e.g. Lavender Honey Glazed Duck">
                </div>

                <!-- Flex Row (Category & Image) -->
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex-1">
                        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Category</label>
                        <select class="js-input-category w-full bg-charcoal-900 border border-white/10 p-3 text-sm text-offwhite focus:outline-none focus:border-gold-500 transition-colors appearance-none">
                            <option value="Breakfast">Breakfast</option>
                            <option value="Starter">Starter</option>
                            <option value="Salads & Soups">Salads & Soups</option>
                            <option value="Main Course">Main Course</option>
                            <option value="Dessert">Dessert</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Image URL</label>
                        <input type="url" class="js-input-image w-full bg-charcoal-900 border border-white/10 p-3 text-sm text-offwhite focus:outline-none focus:border-gold-500 transition-colors" placeholder="https://...">
                    </div>
                </div>
                <div class="flex flex-col md:flex-row gap-6">
                 
                    <div class="flex-1">
                        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Prep Time</label>
                        <input type="url" class="prep-time w-full bg-charcoal-900 border border-white/10 p-3 text-sm text-offwhite focus:outline-none focus:border-gold-500 transition-colors" placeholder="15 mins">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Cook Time</label>
                        <input type="url" class="cook-time w-full bg-charcoal-900 border border-white/10 p-3 text-sm text-offwhite focus:outline-none focus:border-gold-500 transition-colors" placeholder="40 mins">
                    </div>
                </div>

                <!-- Textarea: Ingredients -->
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Ingredients <span class="text-gray-600 capitalize tracking-normal">(one per line)</span></label>
                    <textarea class="js-input-ingredients w-full bg-charcoal-900 border border-white/10 p-3 text-sm text-offwhite focus:outline-none focus:border-gold-500 transition-colors min-h-[100px]" placeholder="1 cup flour&#10;2 eggs&#10;pinch of salt..."></textarea>
                </div>

                <!-- Textarea: Steps -->
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Method</label>
                    <textarea class="js-input-steps w-full bg-charcoal-900 border border-white/10 p-3 text-sm text-offwhite focus:outline-none focus:border-gold-500 transition-colors min-h-[120px]" placeholder="Heat oil in a pan and fry the onions until golden brown.
Add garlic paste and chicken, then cook for 10 minutes. "></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-4 border-t border-white/5">
                    <button type="button" class="js-save-recipe-btn w-full bg-gold-500 hover:bg-gold-400 text-charcoal-900 py-4 font-medium tracking-widest uppercase text-sm transition-colors">
                        Save to Collection
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Minimal CSS to hide scrollbars globally for a cleaner UI look -->
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body>
<script src="script.js"></script>
</html>
